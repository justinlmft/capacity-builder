<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Capacity Builder — Session Builder</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;400;500;600;700&display=swap');

    :root {
      --bone: #FAF9F5;
      --ink: #1a1f2a;
      --line: #e4e1d8;
      --card: #ffffff;
      --muted: #8a877e;
      --soft: #f1efe8;
      --draft: #b9842f;
      --notes: #6b685f;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: var(--bone);
      color: var(--ink);
      line-height: 1.5;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    header {
      padding: 18px 26px;
      border-bottom: 1px solid var(--line);
      flex: 0 0 auto
    }

    header h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: .2px;
      font-weight: 700
    }

    header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px
    }

    .wrap {
      display: flex;
      flex: 1;
      min-height: 0
    }

    .panel {
      padding: 22px 26px
    }

    .dials {
      width: 350px;
      flex: 0 0 350px;
      overflow-y: auto;
      display: flex;
      flex-direction: column
    }

    #splitter {
      flex: 0 0 7px;
      cursor: col-resize;
      border-left: 1px solid var(--line);
      transition: background .12s
    }

    #splitter:hover,
    #splitter.dragging {
      background: var(--line)
    }

    .out {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column
    }

    .out .tabs {
      flex: 0 0 auto
    }

    #slidesWrap {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-top: 2px
    }

    .dial {
      margin-bottom: 26px
    }

    .dial.sep {
      border-top: 2px solid var(--line);
      padding-top: 24px;
      margin-top: 2px
    }

    .dial label.h {
      display: block;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--ink);
      margin-bottom: 10px;
      font-weight: 700
    }

    .opts {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .opt {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      padding: 7px 11px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      transition: .12s
    }

    .opt:hover {
      border-color: var(--ink)
    }

    .opt.sel {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bone);
      font-weight: 600
    }

    .opt.check {
      background: var(--card);
      border-color: var(--ink);
      color: var(--ink);
      font-weight: 600
    }

    .opt.check::before {
      content: "✓ ";
      font-weight: 700
    }

    .opt .dr {
      font-size: 10px;
      color: var(--draft);
      font-style: italic
    }

    .opt.sel .dr {
      color: var(--bone)
    }

    .vars {
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px dashed var(--line)
    }

    .toggle {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 6px
    }

    .toggle input {
      width: 15px;
      height: 15px;
      accent-color: var(--ink)
    }

    .toggle .dr {
      font-size: 11px;
      color: var(--draft);
      font-style: italic
    }

    .mini {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-top: 8px;
      font-size: 13px
    }

    .mini .mopt {
      border: 1px solid var(--line);
      background: var(--card);
      padding: 3px 9px;
      border-radius: 7px;
      cursor: pointer;
      font-size: 12px
    }

    .mini .mopt.sel {
      background: var(--card);
      border-color: var(--ink);
      font-weight: 600
    }

    .mini .mopt.sel::before {
      content: "✓ ";
      font-weight: 700
    }

    .randbar {
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid var(--line)
    }

    .tabs {
      display: flex;
      gap: 6px;
      margin: 0 0 14px;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--line)
    }

    .tab {
      padding: 8px 16px;
      border: 1px solid var(--line);
      border-bottom: none;
      background: var(--soft);
      color: var(--muted);
      border-radius: 9px 9px 0 0;
      cursor: pointer;
      font-size: 13px;
      transition: .12s;
      position: relative;
      top: 1px
    }

    .tab:hover {
      color: var(--ink)
    }

    .tab.sel {
      background: var(--bone);
      color: var(--ink);
      border-bottom: 1px solid var(--bone);
      font-weight: 600
    }

    .tab .n {
      font-size: 11px;
      color: var(--muted);
      margin-left: 6px
    }

    .name {
      font-size: 17px;
      font-weight: 700;
      margin: 0 0 4px
    }

    .flow {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 2px 0 16px;
      flex-wrap: wrap
    }

    .flow .step {
      display: flex;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      background: var(--card);
      border-radius: 999px;
      padding: 5px 14px 5px 6px;
      font-size: 13px;
      font-weight: 600
    }

    .flow .num {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--ink);
      color: var(--bone);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800
    }

    .flow .arr {
      color: var(--muted);
      font-size: 15px
    }

    .bar {
      display: flex;
      gap: 9px;
      margin-bottom: 12px;
      flex-wrap: wrap;
      align-items: center
    }

    .btn {
      padding: 8px 14px;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--bone);
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit
    }

    .btn:hover {
      opacity: .85
    }

    .btn.ghost {
      background: transparent;
      color: var(--ink)
    }

    .count {
      font-size: 12px;
      color: var(--muted)
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin: 0 0 16px
    }

    .slide {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 13px 16px;
      margin-bottom: 10px;
      background: var(--card)
    }

    .slide.fixedc {
      border-style: dashed;
      background: transparent
    }

    .slide.draftcard {
      border-color: var(--draft)
    }

    .slide .tag {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.1px;
      margin-bottom: 5px;
      color: var(--muted)
    }

    .slide .tag .dtag {
      color: var(--draft);
      font-weight: 700
    }

    .slide .stu {
      font-size: 16px;
      margin: 2px 0 0;
      font-weight: 600
    }

    .slide .bod {
      font-size: 13px;
      color: var(--ink);
      opacity: .75;
      margin: 5px 0 0;
      line-height: 1.6
    }

    .slide .note {
      font-size: 12.5px;
      color: var(--notes);
      margin: 8px 0 0;
      padding-left: 10px;
      border-left: 2px solid var(--line);
      line-height: 1.6
    }

    .slide .note b {
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .8px;
      font-size: 10px;
      color: var(--muted)
    }

    .legend {
      font-size: 11.5px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.9
    }

    /* ---------- PRESENTER CONSOLE (this window, while the student window is shared) ---------- */
    #console {
      position: fixed;
      inset: 0;
      background: var(--bone);
      display: none;
      flex-direction: column;
      z-index: 50
    }

    #console.on {
      display: flex
    }

    .cTop {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 26px;
      border-bottom: 1px solid var(--line)
    }

    .cTop .ptimer {
      font-variant-numeric: tabular-nums;
      font-size: 30px;
      font-weight: 700
    }

    .cTop .cnt {
      font-size: 14px;
      color: var(--muted)
    }

    .cMain {
      flex: 1;
      display: flex;
      min-height: 0
    }

    .cPrev {
      flex: 0 0 46%;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      border-right: 1px solid var(--line)
    }

    .pvLabel {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--muted);
      font-weight: 600
    }

    .pvBox {
      border: 1px solid var(--line);
      background: #fff;
      overflow: hidden;
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      border-radius: 6px
    }

    .cNext {
      font-size: 14px;
      color: var(--muted)
    }

    .cNext b {
      color: var(--ink);
      font-weight: 600
    }

    .cNotes {
      flex: 1;
      padding: 26px;
      overflow-y: auto
    }

    .cNotes .nh {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.4px;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 12px
    }

    .cNotes .nt {
      font-size: 19px;
      line-height: 1.6;
      color: var(--ink);
      max-width: 640px
    }

    .cNotes .nt p {
      margin: 0 0 12px
    }

    .cNotes .nt ul {
      margin: 0 0 14px;
      padding-left: 24px
    }

    .cNotes .nt li {
      margin: 5px 0
    }

    .cNotes .nt:empty::before {
      content: "—"
    }

    .cBot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 26px;
      border-top: 1px solid var(--line)
    }

    .cBot button {
      background: var(--ink);
      border: 1px solid var(--ink);
      color: var(--bone);
      border-radius: 8px;
      padding: 9px 18px;
      cursor: pointer;
      font-size: 14px;
      margin-left: 8px;
      font-family: inherit
    }

    .cBot button.ghost {
      background: transparent;
      color: var(--ink)
    }

    .shareTip {
      font-size: 12px;
      color: var(--muted)
    }

    @media print {

      .dials,
      .bar,
      .hint,
      header p,
      .legend,
      .tabs,
      #console {
        display: none
      }

      body {
        background: #fff;
        color: #000;
        height: auto;
        overflow: visible;
        display: block
      }

      .slide {
        border-color: #bbb;
        background: #fff;
        color: #000
      }

      .wrap {
        display: block
      }

      .out {
        overflow: visible;
        display: block
      }

      #slidesWrap {
        overflow: visible
      }
    }

  </style>
</head>

<body>
  <header>
    <div style="display:flex;align-items:center;gap:14px">
      <img src="https://static.wixstatic.com/media/2d354d_b31143f17d0b49b08b0f3df8b49c78f3~mv2.png" alt="Unstucking Academy" style="height:34px;width:auto;display:block">
      <h1>Capacity Builder — Session Builder</h1>
    </div>
  </header>

  <div class="wrap">
    <div class="panel dials">
      <div class="dial"><label class="h">Anchor entry</label>
        <div class="opts" id="senseOpts"></div>
      </div>

      <div class="dial sep"><label class="h">Practice 1</label>
        <div class="vars" style="margin-top:0;border-top:none;padding-top:0" id="p1vars"></div>
      </div>

      <div class="dial sep"><label class="h">Practice 2</label>
        <div class="opts" id="p2opts"></div>
        <div class="vars" id="p2vars"></div>
      </div>

      <div class="dial sep"><label class="h">Practice 3</label>
        <div class="opts" id="p3opts"></div>
        <div class="vars" id="p3vars"></div>
      </div>

      <div class="dial sep"><label class="h">Practice scene</label>
        <p style="font-size:12px;color:var(--muted);margin:-2px 0 10px">The living backdrop from the app, behind the practice prompts. Subtle, and it honors Reduce Motion.</p>
        <div class="opts" id="sceneOpts"></div>
        <p class="hint" id="sceneCap" style="margin:10px 0 0"></p>
      </div>

      <div class="randbar">
        <button class="btn" style="width:100%" onclick="randomize()">🎲 Randomize Practices 2 &amp; 3</button>
      </div>
    </div>

    <div id="splitter"></div>

    <div class="panel out">
      <p class="name" id="sName"></p>
      <div class="flow" id="sAgenda"></div>
      <div class="bar">
        <button class="btn" onclick="startPresent()">▶ Present</button>
        <button class="btn ghost" onclick="window.print()">Print / Save PDF</button>
        <span class="count" id="slideCount"></span>
      </div>
      <div class="tabs" id="tabs"></div>
      <div id="slidesWrap">
        <div id="slidesView"></div>
      </div>
    </div>
  </div>

  <!-- Presenter console (replaces builder while presenting; student window is separate) -->
  <div id="console">
    <div class="cTop">
      <span class="cnt" id="pCount"></span>
    </div>
    <div class="cMain">
      <div class="cPrev">
        <span class="pvLabel">Current slide</span>
        <div class="pvBox" id="pvBox"></div>
        <div class="cNext" id="cNext"></div>
      </div>
      <div class="cNotes">
        <div class="nh">Presenter notes</div>
        <div class="nt" id="cNotes"></div>
      </div>
    </div>
    <div class="cBot">
      <span class="shareTip">← → arrows · space = next · Esc = end</span>
      <span>
        <button class="ghost" onclick="pPrev(event)">← Prev</button>
        <button onclick="pNext(event)">Next →</button>
        <button class="ghost" onclick="endPresent()">End session</button>
      </span>
    </div>
  </div>

  <script>
    /*BEATS-START*/
    /* ---------- DIALS ---------- */
    const SENSES = {
      touch: {
        label: "Touch"
      }, // deck "A" variant
      sight: {
        label: "Sight"
      }, // deck "B" variant
      sound: {
        label: "Sound"
      },
      movement: {
        label: "Movement"
      },
      imagination: {
        label: "Imagination"
      }
    };
    /* ordered easiest → hardest; chip layout follows this order */
    const SKILLS = {
      mindfulness: {
        label: "Mindfulness",
        expect: "connect to the present moment through simple mindfulness"
      },
      anchoring: {
        label: "Anchoring",
        expect: "anchor into safety"
      },
      imagery: {
        label: "Imagery & Invitation",
        expect: "imagine & invite a non-safety emotion"
      },
      obstacles: {
        label: "Obstacles",
        expect: "induce and work with Obstacles"
      },
      balancing: {
        label: "Balancing",
        expect: "balance safety and defense"
      },
      pendulating: {
        label: "Pendulating",
        expect: "pendulate safety and defense"
      }
    };
    /* Description elements — chosen per practice (descOn + delems on p2/p3).
    Context-aware phrasing: object vs safety vs defense. */
    const DESC_LABELS = {
      color: "Color",
      shape: "Shape",
      temp: "Temperature",
      texture: "Texture",
      sound: "Sound",
      doing: "Doing"
    };

    function descBeats(P, ctx, sense, v) {
      const b = mkq(P),
        B = [];
      let keys;
      if (ctx === "defense") {
        if (!v.descOn) return B;
        keys = v.delems;
      } else keys = ["color", "shape", "temp", "texture", "doing"]; // safety & object: always the full deck sequence
      keys.forEach(k => {
        if (k === "color") {
          if (ctx === "object" && sense === "sound") B.push(b("What pitch is it?", "High or low? Or somewhere in between?"));
          else if (ctx === "object" && sense === "movement") B.push(b("What pace is it?", "Slow or quick? Or somewhere in between?"));
          else B.push(b(ctx === "safety" ? "What color is your safety?" : "What color is it?"));
        }
        if (k === "shape") {
          if (ctx === "object" && sense === "sound") B.push(b("Is it thin or full?", "Sparse or rich? Simple or layered?"));
          else if (ctx === "object" && sense === "movement") B.push(b("How big is the movement?", "Small or large? Subtle or full?"));
          else B.push(b(ctx === "safety" ? "What shape is your safety?" : "What shape is it?"));
        }
        if (k === "temp") {
          if (ctx === "object") {
            if (sense === "sight") B.push(b("What brightness is it?"));
            else if (sense === "sound") B.push(b("What volume is it?", "Loud or soft? Or somewhere between?"));
            else if (sense === "movement") B.push(b("What temperature is it?", "Any warmth building?"));
            else B.push(b("What temperature is it?"));
          } else B.push(b(ctx === "safety" ? "What temperature is your safety?" : "What temperature is it?"));
        }
        if (k === "texture") {
          if (ctx === "object" && sense === "sound") B.push(b("What texture does it have?", "Smooth, rough, sharp, soft?"));
          else if (ctx === "object" && sense === "movement") B.push(b("What texture does it have?", "Fluid or stiff? Smooth or jerky?"));
          else B.push(b(ctx === "safety" ? "What texture is your safety?" : "What texture is it?"));
        }
        if (k === "sound") B.push(b(ctx === "object" ? "What sound does it make?" : "Does it have a sound?"));
        if (k === "doing" && ctx !== "object") B.push(b("What is it doing?", "Is there movement to it or not?"));
      });
      return B;
    }
    const OBSTACLE_STATEMENTS = [
      "“I’m capable of achieving my goals.”", "“I deserve to get unstuck.”", "“My feelings are a normal result of my life context.”", "“I am worthy of making change.”",
      "“My feelings are important.”", "“I have everything I need within me.”", "“I am worthy of acceptance.”", "“I am capable of creating positive change.”",
      "“I am enough as I am.”", "“I’m allowed to take up space.”", "“I deserve kindness.”", "“My needs matter.”",
      "“It’s okay to lower my defenses.”", "“I can trust myself.”", "“I’m allowed to feel safe.”", "“Things can get better for me.”"
    ];

    function pickObstacles(n) {
      const a = OBSTACLE_STATEMENTS.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a.slice(0, n);
    }

    /* ---------- STATE ---------- */
    let st = {
      sense: "touch",
      p1: {
        emo: false
      },
      p2: {
        skill: "balancing",
        holdwatch: false,
        bodySpecific: true,
        dur: 30,
        pend: 4,
        pendSec: 10,
        skip: false,
        descSafety: true,
        descOn: false,
        delems: ["color", "shape", "temp", "texture", "doing"]
      },
      p3: {
        skill: "pendulating",
        holdwatch: true,
        bodySpecific: true,
        dur: 15,
        pend: 4,
        pendSec: 10,
        skip: false,
        descSafety: true,
        descOn: true,
        delems: ["color", "shape", "temp", "texture", "doing"]
      }
    };

    /* ---------- BEAT MODEL ----------
    style: "title" (session title) | "ptitle" (practice title) | "info" (header + on-slide body) | "q" (centered question)
    h = student headline · body = on-slide text (info only) · tagline = small top-right label
    note = PRESENTER NOTES (never shown to students) */
    function mkq(kind) {
      return (h, note, draft) => ({
        style: "q",
        kind,
        h,
        body: "",
        tagline: "",
        note: note || "",
        draft: !!draft,
        fixed: false
      });
    }

    function info(h, body, note) {
      return {
        style: "info",
        kind: "",
        h,
        body: body || "",
        tagline: "",
        note: note || "",
        draft: false,
        fixed: true
      };
    }

    const BREAK_MIN = {
      anchoring: 3,
      imagery: 3,
      obstacles: 3,
      balancing: 5,
      pendulating: 5
    }; // break minutes by skill; Mindfulness (P1)=2, passed directly
    function capacityCheck(breakMin) {
      const c = info("Check your capacity:",
        "1. Intolerable distress<br>2. Curiosity turns into evaluation<br>3. Losing connection with your breath<br>4. Intrusive cognitions" +
        "<br><br>Ask yourself:<br>– What do I need right now?<br>– Do I genuinely want to continue?<br>– Does my body genuinely want to continue?");
      if (breakMin) c.breakMin = breakMin;
      return c;
    }

    const BREATH_NOTE_FULL = "Check in with the natural ins and outs of your breath. How is your body naturally breathing right now? Don’t change your breathing, just notice it. If it changes by itself because you’ve paid attention to it, that’s fine. — Chest or belly? Full or shallow? Tense or relaxed?";
    const BREATH_NOTE_SHORT = "Not controlling. — Chest or belly? Full or shallow? Tense or relaxed?";
    const HEAR_NOTE = "Anything? Silence? Inside the room… what do you hear? Outside the room… what do you hear?";

    /* ---------- THE ANCHORING LADDER (opens P2 and P3, per the decks) ---------- */
    function ladderBeats(P, sense, o, v) { // o = {rate}
      const b = mkq(P),
        B = [];
      /* THE ARRIVING BREATH (app parity, 2026-09-06). One intentional breath to open
         every practice — the pair to "Take one intentional breath." at the end of the
         closing. Everything between the two is natural, unsteered breathing. */
      B.push(b("Take one intentional breath to begin.", "One breath in on purpose — and let it out however it wants to come out. — After this, we let your body breathe the way it wants. This one is on purpose; the rest are not."));
      if (sense === "touch") {
        B.push(b("Identify one thing in your space."));
        B.push(b("What do you hear?", HEAR_NOTE));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      } else if (sense === "sight") {
        B.push(b("Let your eyes gaze however they like."));
        B.push(b("What do you hear?", HEAR_NOTE));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      } else if (sense === "sound") {
        B.push(b("Notice the sounds outside your space.", "Beyond the room — what reaches you from further away?"));
        B.push(b("Now bring your hearing inside your space.", "Right around you — what’s here, close by?"));
        B.push(b("Notice what comes and goes.", "A bird, a voice, a passing car — sounds that pop in, then fade. Here, then gone."));
        B.push(b("Notice what stays constant.", "A hum, a fan, the AC — sound holding steady underneath the rest."));
        B.push(b("Notice the silence too.", "The spaces between sounds — the quiet they arrive into and leave behind."));
        B.push(b("Let each sound be temporary.", "Nothing to hold onto. One moment, then the next — sound is always passing through."));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      } else if (sense === "movement") {
        B.push(b("Begin to move, gently and on purpose.", "Small and easy — you’re not performing. Just enough to feel it."));
        B.push(b("Roll your ankles.", "Slow, both directions. No strain."));
        B.push(b("Roll your wrists.", "Let your hands soften."));
        B.push(b("Roll your shoulders.", "Up, back, and down — let them drop."));
        B.push(b("Roll your neck, slowly.", "Small arcs, only where it feels good. Skip anything sharp."));
        B.push(b("Let yourself stretch into whatever wants to lengthen.", "Reach, or a slight side bend — just to the easy edge."));
        B.push(b("Pause. Notice what lingers.", "The sensation doesn’t stop the moment you do — feel it settle."));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      } else if (sense === "imagination") {
        B.push(b("Bring to mind a place where you feel at ease.", "Real or imagined — a memory, or made up. Somewhere you’d like to be."));
        B.push(b("Let your eyes be as they want."));
        B.push(b("Let the place take shape.", "Indoors or out? Day or night? Where are you in it?"));
        B.push(b("Look around — what do you see?", "Colors, light, what’s near and what’s far."));
        B.push(b("What do you hear there?", "Or is it quiet?"));
        B.push(b("What do you feel there?", "The air, the temperature, the ground beneath you."));
        B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      }
      if (v.skill !== "imagery") B.push(b("Imagine & Invite anything else you may be feeling right now."));
      if (sense === "touch") {
        B.push(b("Focus on your one thing."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("What does it feel like on your skin?", "Does it feel different on different parts of your hand? Fingertips? Palm? Knuckles? Wrist?"));
      } else if (sense === "sight") {
        B.push(b("Notice what your eyes are drawn towards."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("How do your eyes interact with it?", "Let your eyes take your attention where they want."));
      } else if (sense === "sound") {
        B.push(b("Choose what to anchor on.", "A group of sounds together, a sound that comes and goes, or a constant sound — whichever is easiest to stay with. Let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("How does it arrive to you?", "Steady or rhythmic? Close or distant? Does it pulse, or hold?"));
      } else if (sense === "movement") {
        B.push(b("Choose one movement to return to.", "Whichever felt best, or most available — let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("Make it bigger, smaller, or still.", "You’re the one in control of it — notice that."));
        B.push(b("What does the movement feel like in your body?", "Where do you feel it most? In the joint, the muscle, the whole limb?"));
      } else if (sense === "imagination") {
        B.push(b("Let one part of the place hold your attention.", "The detail or spot that feels best — let that be your anchor."));
        B.push(b("Does it give you a sense of like or dislike?", "What about it do you like?"));
        B.push(b("Notice you can shift it.", "Move closer, change the light, add or remove something — it’s yours."));
      }
      descBeats(P, "object", sense, v).forEach(x => B.push(x));
      B.push(b("As you mindfully experience it, how does it affect your breath?", "Chest or belly? Full or shallow? Tense or relaxed?"));
      B.push(b("As you mindfully experience it, how does it affect your posture?", "Upright or collapsed? Energized or relaxed?"));
      B.push(b("As you mindfully experience it, are you more or less likely to smile?", "Let yourself smile if so."));
      B.push(b("Do you feel more or less connection…?", "…to the present? To your senses? Your breath? Your inner experience? — Check your capacity."));
      B.push(b("What emotion word best fits your current safety experience?", "Calm? Still? Playful? Joy? Curious? — “Something like…”"));
      B.push(b("Does it make sense that you feel this right now?", "Given where you are and what you just did. — “I feel _____, which makes sense based on my life context.”"));
      B.push(b("Notice how safety feels in your body generally.", "Mobile or immobile? Heavy or light?"));
      B.push(b("Notice how safety feels in your body specifically.", "Is there one place in your body where this emotion is even more obvious? Coming from, or going to? Common areas: face, chest, and belly. — If there’s nothing there, that’s fine. Numbness is a real experience too. Just notice the not-feeling."));
      B.push(b("How is your body breathing?", BREATH_NOTE_SHORT));
      if (v.descSafety !== false) descBeats(P, "safety", sense, v).forEach(x => B.push(x));
      if (o.rate) B.push(b("On a scale of 0–10, what is your current level of safety?"));
      return B;
    }

    const CURIOSITY = (P) => mkq(P)("Do you feel interest or curiosity about your non-safety internal experiences?", "You can say yes or no. Both are good answers — noticing which one is true for you is the practice. A yes is what opens the work on the other side.");

    /* ---------- INVITING THE NON-SAFETY EMOTION ---------- */
    function inviteBeats(P, v) {
      const b = mkq(P),
        B = [];
      B.push(b("What is the non-safety emotion you would like to invite?", "“I feel _____.”"));
      B.push(b("Does it make sense you have this non-safety emotion based on your life context?"));
      B.push(b("Is it okay for this non-safety emotion to be?", "You can say yes or no."));
      B.push(b("On a 0–10 scale, what is the intensity level of this non-safety emotion?"));
      /* THE CAPACITY GATE, WHERE THE PRACTICE ACTUALLY ESCALATES (app parity, 2026-09-06).
         A re-check has to sit where there is something new to have capacity FOR — the moment
         before the room is asked into the body — not at the moment it crosses the axis, two
         beats after the interest question. */
      B.push(b("Do you have the capacity to turn toward the non-safety?", "Be honest with yourself — capacity and genuine willingness, not just permission. If yes, we go gently. If not, staying with safety is a complete practice on its own. — Intolerable distress? Curiosity turning into evaluation? Losing the breath? Intrusive thoughts?"));
      B.push(b("How does this non-safety emotion feel in your body generally?", "Mobile or immobile? Heavy or light?"));
      /* THE SPECIFIC DEPTH (app parity, 2026-09-06). The shallowest a Balancing or Pendulating
         practice goes is the body OVERALL. Finding the one place it lives is the next depth,
         and describing it is the one after that — cumulative, and gated on mastery. */
      if (!v || v.bodySpecific !== false) {
        B.push(b("How does this non-safety emotion feel in your body specifically?", "Is there one place in your body where this emotion is even more obvious? Coming from, or going to? Common areas: face, chest, and belly. — If you’re not finding it in your body, that’s okay. Don’t go hunting. Come back to safety for a moment and we’ll go on from there."));
      }
      B.push(b("How is your body breathing?", "Check your capacity."));
      return B;
    }

    /* ---------- CLOSING OF EACH SKILL PRACTICE ---------- */
    function closingBeats(P, breakMin) {
      const b = mkq(P);
      return [
        b("Let your awareness begin to widen.", "No rush."),
        b("Reconnect to the external present moment.", "If your eyes are closed, let them open when they’re ready. — What do you see? What do you hear?"),
        b("Come back to the one thing you anchored on.", "Whatever it was — a movement, an image, something you could see, hear, or hold. Give it a bit of appreciation for carrying you into the present moment."),
        b("Give yourself kindness if you have it.", "Real, not performative. If there isn’t one available right now, that’s alright — you showed up, and that stands on its own whether or not you can say it to yourself."),
        b("Let your body move however feels good (or stay just as you are).", "Stretch, shift, settle. If you’ve been moving, keep going. — Push, pull, squeeze, wiggle, clench, roll, stand, stretch, hug… There’s no wrong way."),
        b("Take one intentional breath."),
        capacityCheck(breakMin)
      ];
    }

    /* ---------- PENDULATION SEQUENCE ---------- */
    function pendBeats(P, v) {
      const b = mkq(P),
        B = [];
      if (v.skip) {
        B.push(b("Skip stones across the defense.", "So light, so quick, it never pulls you under. Safety… touch… safety… touch.", true));
        B.push(b("Bring your attention back to the safety experience.", null, true));
        B.push(b("Has safety changed?", null, true));
        return B;
      }
      const flat = !v.holdwatch;
      const t = (sec) => "~" + (flat ? v.pendSec : sec) + " seconds";
      B.push(b("Bring your attention back to the safety experience."));
      B.push(b("Has safety changed?", t(10)));
      B.push(b("Bring your attention back to the non-safety emotion."));
      B.push(b("On a 0–10 scale, what is the intensity level of this non-safety emotion?"));
      if (v.descOn) descBeats(P, "defense", st.sense, v).forEach(x => B.push(x));
      B.push(b("How is your body breathing?", "Check your capacity."));
      B.push(b("Bring your attention back to the safety experience.", t(6)));
      B.push(b("Has safety changed?"));
      B.push(b("Remind yourself that you’re literally safe."));
      /* THE INTEREST IMPULSE, READ ONCE MORE (app parity, 2026-09-06). It is a dose signal,
         not only a door: as long as the interest is there it is okay to keep pendulating,
         and when it thins, that is the sign to stop. Once — it is not a refrain. */
      B.push(b("Are you still curious about the non-safety?", "As long as the interest is still there, it’s okay to keep going. If curiosity has thinned, or hesitation has shown up, that’s the sign to stop — and stopping inside your capacity is the win, not the failure."));
      B.push(b("Bring your attention back to the non-safety experience."));
      B.push(b("Has non-safety changed?", t(6)));
      B.push(b("Bring your attention back to the safety experience.", t(4)));
      for (let i = 4; i <= v.pend; i++) {
        if (flat) {
          B.push(b("And back to the non-safety experience.", "~" + v.pendSec + " seconds"));
          B.push(b("And back to safety.", "~" + v.pendSec + " seconds"));
        } else {
          B.push(b("And back to defense, briefly.", "~2 seconds"));
          B.push(b("And back to safety, briefly.", "~2 seconds"));
        }
      }
      if (v.holdwatch) {
        /* Permission for impulse AND for stillness, immediately before the hold — this is
           where spontaneous expression shows up, and it needs saying before it does. */
        B.push(b("Nothing has to happen here.", "You don’t have to make anything move or shift — being with it is enough. And if an impulse to move shows up — a stir, a shake, a stretch, a push — let it. Stillness is fine too."));
        B.push(b("Hold the two. Remain open to potential shifts.", "~" + v.dur + " seconds — Do they want to interact?"));
      }
      return B;
    }

    /* ---------- SKILL ASSEMBLERS ---------- */
    function ptitle(P, label, tagline, note, track) {
      return {
        style: "ptitle",
        kind: P,
        h: label,
        body: "",
        tagline: tagline || "",
        note: note || "",
        track: track || "defense",
        draft: false,
        fixed: false
      };
    }

    function mindfulnessBeats(P, v) {
      const b = mkq(P),
        B = [];
      B.push(ptitle(P, "Mindfulness", "", "Brief, simple mindfulness — connect to the present moment.", "safety"));
      /* THE ARRIVING BREATH (app parity, 2026-09-06) — the pair to the intentional breath
         that now ends every practice. These two are the only steered breaths in the session. */
      B.push(b("Take one intentional breath to begin.", "One breath in on purpose — and let it out however it wants to come out. — After this, we let your body breathe the way it wants. This one is on purpose; the rest are not."));
      B.push(b("On a scale of 0–10, what is your current level of safety?"));
      B.push(b("How is your body breathing?", BREATH_NOTE_FULL));
      B.push(b("What do you hear?", HEAR_NOTE));
      B.push(b("How is your body breathing?", BREATH_NOTE_SHORT));
      B.push(b("What do you touch?", "We’ll start with your entire body. What is it you’re sitting, standing, laying, or leaning on? Can you feel its firmness? Or is it soft? Does it let you sink into it? What can you feel specifically on your skin? The air? The fabric of your clothes? Something you can hold onto nearby?"));
      B.push(b("How is your body breathing?", BREATH_NOTE_SHORT));
      B.push(b("What do you see?", "Open your eyes if they’re closed, as they are ready to open. You don’t need to do anything special — just look where they want you to look. If your neck wants to move to help your eyes see more, let your neck and eyes work together. Is there one thing that is pulling at your eyes? What’s its shape? Let your eyes trace the edges. Notice how the light from the room touches it. And the shadows it creates."));
      B.push(b("How is your body breathing?", BREATH_NOTE_SHORT));
      B.push(b("On a scale of 0–10, what is your current level of safety?"));
      if (v.emo) {
        B.push(b("Is there an emotion you’re holding onto?"));
        B.push(b("Invite it to be with you."));
      }
      /* A MINDFULNESS PRACTICE HAS TO CLOSE TOO (app parity, 2026-09-06). This used to end
         on the capacity slide and send the room straight into a break, with no way back out
         of an eyes-closed practice. The short form of the canonical closing. */
      B.push(b("Let your awareness begin to widen.", "No rush."));
      B.push(b("Reconnect to the external present moment.", "If your eyes are closed, let them open when they’re ready. — What do you see? What do you hear?"));

    }

    function skillBeats(P, v, sense) {
      const b = mkq(P),
        key = v.skill;
      if (key === "mindfulness") return mindfulnessBeats(P, v);
      /* DEPTH GATING (app parity, 2026-09-06). The three defense depths are cumulative —
         the body overall, then the one place it lives, then description — so a deeper one
         cannot run without the shallower one. Describing defense also requires describing
         safety: you cannot hold non-safety next to safety you have not described. And hold
         & watch is an add-on at the deepest depth only, never a free toggle. */
      if (v.bodySpecific === undefined) v.bodySpecific = true;
      if (!v.bodySpecific) v.descOn = false;
      if (v.descOn) v.descSafety = true;
      if (!v.descOn) v.holdwatch = false;
      let B = [];
      const tagLines = [];
      if (key === "obstacles") tagLines.push("4 STATEMENTS");
      if (v.descSafety) tagLines.push("DESCRIBING SAFETY");
      if ((key === "balancing" || key === "pendulating") && v.descOn) tagLines.push("DESCRIBING DEFENSE");
      if (key === "pendulating" && v.skip) tagLines.push("SKIPPING STONES");
      if ((key === "balancing" || key === "pendulating") && v.holdwatch) tagLines.push("HOLD & WATCH · ~" + v.dur + "S");
      if (key === "pendulating" && !v.skip) tagLines.push(v.pend + " PENDULATIONS" + (v.holdwatch ? "" : " · ~" + v.pendSec + "S"));
      const TAG = tagLines.join("<br>");
      const TRACK = key === "anchoring" ? "safety" : "defense";
      if (key === "anchoring") {
        B.push(ptitle(P, "Anchoring", TAG, "We will: anchor into safety.", TRACK));
        B = B.concat(ladderBeats(P, sense, {
          rate: true
        }, v));
        B.push(CURIOSITY(P));
      } else if (key === "balancing") {
        let we = "We will: anchor into safety — balance safety and defense" + (v.descOn ? " — describe defense" : "") + (v.holdwatch ? " — hold and watch for ~" + v.dur + " seconds" : "") + ".";
        B.push(ptitle(P, "Balancing", TAG, we, TRACK));
        B.push(b("Choose a non-safety emotion.", "Present moment? Recent past? Upcoming? Lingering? — Remain open to Obstacles."));
        B = B.concat(ladderBeats(P, sense, {
          rate: true
        }, v));
        B.push(CURIOSITY(P));
        B = B.concat(inviteBeats(P, v));
        if (v.descOn) descBeats(P, "defense", st.sense, v).forEach(x => B.push(x));
        B.push(b("Bring your attention back to the safety experience."));
        B.push(b("Has safety changed?"));
        if (v.holdwatch) {
          /* Permission for impulse AND for stillness, immediately before the hold — this is
               where spontaneous expression shows up, and it needs saying before it does. */
          B.push(b("Nothing has to happen here.", "You don’t have to make anything move or shift — being with it is enough. And if an impulse to move shows up — a stir, a shake, a stretch, a push — let it. Stillness is fine too."));
          B.push(b("Hold the two.", "~" + v.dur + " seconds — Do they want to interact?"));
        }
      } else if (key === "pendulating") {
        let we = "We will: pendulate " + v.pend + " times" + (v.holdwatch ? ", decreasing in time spent on each" : ", ~" + v.pendSec + " seconds each") + (v.descOn ? " — describe defense" : "") + (v.holdwatch ? " — hold and watch safety and defense for ~" + v.dur + " seconds, open to the two interacting (or not)" : "") + ".";
        B.push(ptitle(P, "Pendulating", TAG, we, TRACK));
        B.push(b("Choose a non-safety emotion.", "Present moment? Recent past? Upcoming? Lingering? — Remain open to Obstacles."));
        B = B.concat(ladderBeats(P, sense, {
          rate: false
        }, v));
        B.push(CURIOSITY(P));
        B = B.concat(inviteBeats(P, v));
        B = B.concat(pendBeats(P, v));
      } else if (key === "imagery") { // from Self-Regulation Simplified, Imagery & Invitation Practices 1–2
        B.push(ptitle(P, "Imagery & Invitation", TAG, "We will: anchor into safety — imagine & invite a non-safety emotion.", TRACK));
        B.push(b("Choose a non-safety emotion.", "Present moment? Recent past? Upcoming? Lingering? — Remain open to Obstacles."));
        B = B.concat(ladderBeats(P, sense, {
          rate: true
        }, v));
        B.push(CURIOSITY(P));
        B.push(b("What is one non-safety experience you can Validate?", "“I do feel _____.” / “I don’t like it, but I feel _____.” / “Yeah, fine, I feel _____.”"));
        B.push(b("Normalize that experience.", "“I feel _____, which makes sense based on my life context.”"));
        B.push(b("What does _____ look like?", "“_____ looks like _____.”"));
        B.push(b("Where is _____?"));
        B.push(b("What is _____ doing?"));
        B.push(b("Invite _____ to be with you while you reconnect with the external world."));
      } else if (key === "obstacles") { // from Self-Regulation Simplified, Obstacles Practices 1–2
        B.push(ptitle(P, "Obstacles", TAG,
          "We will: anchor into safety — induce Obstacles through four statements — Validate, Normalize, Imagine & Invite the Obstacle.", TRACK));
        B = B.concat(ladderBeats(P, sense, {
          rate: true
        }, v));
        B.push(b("4 statements.", "We’ll say four statements. Notice what surfaces — the tightening, the argument, the thought."));
        pickObstacles(4).forEach(s => B.push(b(s, "Notice what surfaces as you say it to yourself.")));
        B.push(b("Validate the Obstacle."));
        B.push(b("Normalize the Obstacle."));
        B.push(b("Imagine.", "What does it look like? Where is it? What is it doing?"));
        B.push(b("Invite the Obstacle to be with you while you reconnect with the external world."));
      }
      B = B.concat(closingBeats(P, BREAK_MIN[v.skill] || 3));
      return B;
    }

    const TABS = {

      B.push(info("what to expect",

      B.push(info("touch the edge of Capacity",

    /* ---------- CONTROLS ---------- */
    function chips(id, obj, get, set, invert) {
      const el = document.getElementById(id);
      el.innerHTML = "";
      Object.keys(obj).forEach(k => {
        const d = document.createElement("div");
        d.className = "opt" + (get() === k ? (invert ? " sel" : " check") : "");
        d.innerHTML = obj[k].label + (obj[k].draft ? ' <span class="dr">draft</span>' : "");
        d.onclick = () => {
          set(k);
          render();
        };
        el.appendChild(d);
      });
    }

    function tog(pr, key, label, extra) {
      return '<label class="toggle"><input type="checkbox" ' + (st[pr][key] ? "checked" : "") +
        ' onchange="st.' + pr + '.' + key + '=this.checked;render()"> ' + label + (extra ? ' <span class="dr">' + extra + '</span>' : "") + '</label>';
    }

    function miniChips(pr, key, vals, label, suffix) {
      let h = '<div class="mini"><span>' + label + '</span>';
      vals.forEach(x => {
        h += '<span class="mopt' + (st[pr][key] === x ? " sel" : "") + '" onclick="st.' + pr + '.' + key + '=' + x + ';render()">' + x + (suffix || "") + '</span>';
      });
      return h + '</div>';
    }

    function delemsHTML(pr) {
      const v = st[pr];
      let h = '<div class="opts" style="margin-top:8px">';
      Object.keys(DESC_LABELS).forEach(k => {
        const on = v.delems.includes(k);
        h += '<span class="opt' + (on ? ' check' : '') + '" style="padding:4px 9px;font-size:12px" onclick="toggleDelem(\'' + pr + '\',\'' + k + '\')">' + DESC_LABELS[k] + '</span>';
      });
      h += '<span class="opt" style="padding:4px 9px;font-size:12px" onclick="randomizeDelems(\'' + pr + '\')">🎲</span></div>';
      return h;
    }

    function toggleDelem(pr, k) {
      const a = st[pr].delems,
        i = a.indexOf(k);
      if (i >= 0) a.splice(i, 1);
      else a.push(k);
      render();
    }

    function randomizeDelems(pr) {
      const keys = Object.keys(DESC_LABELS);
      for (let i = keys.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [keys[i], keys[j]] = [keys[j], keys[i]];
      }
      st[pr].delems = keys.slice(0, 2 + Math.floor(Math.random() * (keys.length - 1)));
      render();
    }

    function varsHTML(pr) {
      const v = st[pr],
        s = v.skill;
      let h = "";
      if (s === "mindfulness") return tog(pr, "emo", "Emotion check-in");
      const deep = (s === "balancing" || s === "pendulating");
      if (v.bodySpecific === undefined) v.bodySpecific = true;
      /* Describing safety is a free choice UNTIL defense description is on, at which point
         it is required — you cannot hold non-safety next to safety you have not described. */
      if (deep && v.descOn) h += '<label class="toggle"><input type="checkbox" checked disabled> Describe safety <span class="dr">required</span></label>';
      else h += tog(pr, "descSafety", "Describe safety");
      if (deep) {
        /* DEPTH — cumulative, and in order (app parity, 2026-09-06): the body overall, then
           the one place it lives, then description. A deeper one is not offerable without the
           shallower one, and hold & watch is an add-on at the deepest depth only. */
        h += tog(pr, "bodySpecific", "Find the one place it lives");
        if (v.bodySpecific) {
          h += tog(pr, "descOn", "Describe defense");
          if (v.descOn) {
            h += delemsHTML(pr);
            h += tog(pr, "holdwatch", "Hold &amp; watch");
            if (v.holdwatch) h += miniChips(pr, "dur", [15, 30, 45, 60, 90, 120], "Hold", "s");
          }
        }
      }
      if (s === "pendulating") {
        h += miniChips(pr, "pend", [3, 4, 5, 6], "Pendulations", "");
        if (!v.holdwatch) h += miniChips(pr, "pendSec", [5, 10, 15, 20, 30], "Seconds", "s");
        h += tog(pr, "skip", "Skipping stones", "draft");
      }
      return h;
    }

    /* ---------- RANDOMIZE P2 & P3 ---------- */
    function randomize() {
      const keys = Object.keys(SKILLS).filter(k => k !== "mindfulness");
      const pick = a => a[Math.floor(Math.random() * a.length)];
      const coin = () => Math.random() < 0.5;
      st.p2.skill = pick(keys);
      let k3 = pick(keys);
      while (k3 === st.p2.skill) k3 = pick(keys);
      st.p3.skill = k3;
      ["p2", "p3"].forEach(pr => {
        const v = st[pr];
        v.holdwatch = coin();
        v.dur = pick([15, 30, 45, 60, 90, 120]);
        v.pend = pick([3, 4, 5, 6]);
        v.pendSec = pick([5, 10, 15, 20, 30]);
        v.skip = false;
        v.bodySpecific = coin();
        v.descOn = coin();
        const keys = Object.keys(DESC_LABELS);
        for (let i = keys.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [keys[i], keys[j]] = [keys[j], keys[i]];
        }
        v.delems = keys.slice(0, 2 + Math.floor(Math.random() * (keys.length - 1)));
      });
      render();
    }

    window.addEventListener("beforeprint", () => {

    /* ---------- PRESENT: student window + presenter console ----------
    The pop-up loads THIS file with ?student=1, so it has a real title
    ("Capacity Builder — Slides") instead of about:blank. The two windows

    const IS_STUDENT = /[?&]student=1/.test(location.search);
    /* ============================================================
       LIVE SCENES — ported from the SNB app player (player.html).
       Seven scenes behind the live practice prompts (q slides).
       Ink on bone; the two light scenes run gold/bone on a dark
       field, exactly as in the app. Reduced-motion holds still.
       ============================================================ */
    const MM_SCENES = ['circles', 'drift', 'pond', 'reeds', 'breeze', 'sunbeam', 'fireflies'];
    const MM_DARK = {
      sunbeam: 1,
      fireflies: 1
    };
    const SCENE_CAP = {
      '': 'a different scene each session, chosen at random when you present.',
      circles: 'a slow breathing circle, the app’s pacer.',
      drift: 'soft specks drifting upward, each at its own pace.',
      pond: 'still water, a ripple now and then.',
      reeds: 'reeds swaying in an uneven breeze.',
      breeze: 'strands carried sideways on a light wind, each at its own speed.',
      sunbeam: 'a still beam of light, dust hanging in it. dims the slide.',
      fireflies: 'small lights arriving and leaving on their own time. dims the slide.'
    };

    function sceneChips() {
      const el = document.getElementById('sceneOpts');
      if (!el) return;
      el.innerHTML = '';
      const sel = st.scene || '';
      const opts = [
        ['', 'surprise me']
      ].concat(MM_SCENES.map(s => [s, s]));
      opts.forEach(function(o) {

      });

    }

    function makeSceneEngine(canvas) {
      const g = canvas.getContext('2d');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      let scene = 'circles',
        active = false,
        vis = 0;
      let motes = [],
        reeds = [],
        rips = [],
        strands = [],
        dust = [],
        flies = [],
        ripNext = 0,
        sT = 0,
        sLast = 0,
        raf = null,
        seeded = false;
      const INK = [26, 31, 42],
        BONE = [250, 249, 245];

      function fit() {
        const dpr = devicePixelRatio || 1,
          w = canvas.clientWidth || 1,
          h = canvas.clientHeight || 1;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        g.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      /* fluid field density (ported from the app's player.html, Fluid Phase 3,
         2026-07-19): reeds/motes/flies scale with the canvas width instead of
         a fixed phone-era count, so a wide presenter/student window reads as
         full as the app's own desktop view. Reduced-motion holds the
         phone-minimum density regardless of width. */
      function _fieldW() {
        return canvas.clientWidth || innerWidth || 390;
      }

      function _initReeds() {
        reeds = [];
        const RN = reduce ? 7 : Math.round(Math.max(7, Math.min(22, _fieldW() / 100)));
        for (let i = 0; i < RN; i++) reeds.push({
          x: (i / (RN - 1)) * .96 + .02 + (Math.random() - .5) * .028,
          h: .24 + Math.random() * .42,
          per: 8 + Math.random() * 8,
          ph: Math.random() * 6.283,
          amp: .035 + Math.random() * .045,
          w: 1.1 + Math.random() * 1.5,
          a: .3 + Math.random() * .32
        });
      }

      function _initMotes() {
        motes = [];
        const RN = reduce ? 9 : Math.round(Math.max(9, Math.min(20, _fieldW() / 70)));
        for (let i = 0; i < RN; i++) motes.push({
          x: Math.random(),
          y: Math.random(),
          r: 1.5 + Math.random() * 3.5,
          v: (3.5 + Math.random() * 8) / 1000,
          dx: (Math.random() - .5) * .003,
          a: .18 + Math.random() * .3
        });
      }

      function _initFlies() {
        flies = [];
        const RN = reduce ? 7 : Math.round(Math.max(7, Math.min(14, _fieldW() / 100)));
        for (let i = 0; i < RN; i++) flies.push({
          x: .12 + .76 * (i / (RN - 1)) + (Math.random() - .5) * .09,
          y: .15 + Math.random() * .62,
          per: 5.5 + Math.random() * 6.5,
          ph: Math.random() * 10,
          wx: 8 + Math.random() * 9,
          wy: 6 + Math.random() * 8
        });
      }

      function seed() {
        rips = [];
        strands = [];
        dust = [];
        ripNext = 0;
        sT = 0;
        sLast = 0;
        _initMotes();
        _initReeds();
        _initFlies();
        for (let i = 0; i < 7; i++) strands.push({
          y: .15 + .7 * (i / 6) + (Math.random() - .5) * .06,
          len: .2 + Math.random() * .22,
          sp: (28 + Math.random() * 46) / 1000,
          x: Math.random() * 1.4 - .2,
          amp: 2.5 + Math.random() * 4,
          ph: Math.random() * 6.283,
          a: .22 + Math.random() * .28
        });
        for (let i = 0; i < 8; i++) dust.push({
          x: .36 + Math.random() * .24,
          y: .12 + Math.random() * .72,
          r: 1 + Math.random() * 1.6,
          per: 9 + Math.random() * 11,
          ph: Math.random() * 6.283,
          ax: 4 + Math.random() * 6,
          ay: 8 + Math.random() * 9,
          a: .35 + Math.random() * .25
        });
        seeded = true;
      }

      function set(sc) {
        if (sc && sc !== scene) {
          scene = sc;
          seed();
        }
      }

      function show(on) {
        active = !!on;
      }

      function draw() {
        const W = canvas.clientWidth,
          H = canvas.clientHeight;
        g.clearRect(0, 0, W, H);
        vis += ((active ? 1 : 0) - vis) * 0.08;
        if (vis < 0.01) return;
        if (!seeded) seed();
        const t = performance.now() / 1000,
          dt = Math.min(.05, Math.max(0, t - sLast));
        sLast = t;
        if (!reduce) sT += dt;
        const unit = Math.min(Math.min(W, H), 430),
          dark = !!MM_DARK[scene],
          base = dark ? BONE : INK,
          fade = vis;
        const col = function(a) {
          return 'rgba(' + base[0] + ',' + base[1] + ',' + base[2] + ',' + (a * fade) + ')';
        };
        if (scene === 'drift') {
          motes.forEach(function(m) {
            if (!reduce) {
              m.y -= m.v * dt * 3;
              m.x += m.dx * dt * 3;
              if (m.y < -.05) {
                m.y = 1.05;
                m.x = Math.random();
              }
            }
            g.strokeStyle = col(m.a);
            g.lineWidth = 1.3;
            g.beginPath();
            g.arc(m.x * W, m.y * H, m.r * (unit / 300 + .6), 0, 6.283);
            g.stroke();
          });
        } else if (scene === 'pond') {
          if (!reduce && sT >= ripNext) {
            rips.push({
              x: .2 + Math.random() * .6,
              y: .25 + Math.random() * .5,
              b: sT
            });
            ripNext = sT + 4 + Math.random() * 5;
            if (rips.length > 4) rips.shift();
          }
          rips.forEach(function(rp) {
            const age = sT - rp.b,
              life = 6;
            if (age > life) return;
            const p = age / life,
              R = unit * (.06 + .42 * p),
              aOut = (p < .08 ? p / .08 : Math.max(0, 1 - ((p - .08) / .57))) * .5,
              aIn = (p < .08 ? p / .08 : 1 - ((p - .08) / .92)) * .5;
            g.lineWidth = 1.5;
            g.strokeStyle = col(aOut);
            g.beginPath();
            g.arc(rp.x * W, rp.y * H, R, 0, 6.283);
            g.stroke();
            g.strokeStyle = col(aIn);
            g.beginPath();
            g.arc(rp.x * W, rp.y * H, R * .62, 0, 6.283);
            g.stroke();
          });
        } else if (scene === 'reeds') {
          reeds.forEach(function(rd) {
            const sw = Math.sin(sT * 6.283 / rd.per + rd.ph) * rd.amp,
              bx = rd.x * W,
              by = H,
              hh = rd.h * H,
              tx = bx + sw * hh,
              ty = by - hh;
            g.strokeStyle = col(rd.a != null ? rd.a : .5);
            g.lineWidth = rd.w;
            g.lineCap = 'round';
            g.beginPath();
            g.moveTo(bx, by);
            g.quadraticCurveTo(bx + sw * hh * .25, by - hh * .55, tx, ty);
            g.stroke();
          });
        } else if (scene === 'breeze') {
          strands.forEach(function(s) {
            if (!reduce) {
              s.x += s.sp * dt;
              if (s.x > 1.15) {
                s.x = -.35;
                s.y = .15 + Math.random() * .7;
              }
            }
            const y0 = s.y * H,
              x0 = s.x * W,
              L = s.len * W;
            g.strokeStyle = col(s.a);
            g.lineWidth = 1.6;
            g.lineCap = 'round';
            g.beginPath();
            g.moveTo(x0, y0);
            g.lineTo(x0 + L, y0);
            g.stroke();
          });
        } else if (scene === 'sunbeam') {
          const AMBER = function(a) {
              return 'rgba(246,228,180,' + (a * fade) + ')';
            },
            bw = W * .34,
            grd = g.createLinearGradient(0, -H, 0, H);
          grd.addColorStop(0, AMBER(.30));
          grd.addColorStop(1, AMBER(.04));
          g.save();
          g.translate(W * .5, H * .5);
          g.rotate(.3);
          g.fillStyle = grd;
          g.fillRect(-bw / 2, -H * 1.2, bw, H * 2.4);
          g.restore();
          dust.forEach(function(d) {
            const px = (d.x * W) + Math.sin(sT * 6.283 / d.per + d.ph) * d.ax,
              py = (d.y * H) + Math.cos(sT * 6.283 / (d.per * 1.3) + d.ph) * d.ay;
            g.fillStyle = 'rgba(26,31,42,' + (Math.min(1, .5 + d.a) * fade) + ')';
            g.beginPath();
            g.arc(px, py, d.r, 0, 6.283);
            g.fill();
          });
        } else if (scene === 'fireflies') {
          const B2 = function(a) {
            return 'rgba(250,249,245,' + (a * fade) + ')';
          };
          flies.forEach(function(f) {
            const p = ((sT + f.ph) % f.per) / f.per,
              tw = Math.sin(p * Math.PI),
              px = (f.x * W) + Math.sin(sT * 6.283 / (f.per * 2.1) + f.ph) * f.wx,
              py = (f.y * H) + Math.cos(sT * 6.283 / (f.per * 1.7) + f.ph) * f.wy;
            g.fillStyle = B2(.12 * tw);
            g.beginPath();
            g.arc(px, py, 7, 0, 6.283);
            g.fill();
            g.fillStyle = B2(.3 * tw);
            g.beginPath();
            g.arc(px, py, 4, 0, 6.283);
            g.fill();
            g.fillStyle = B2(.85 * tw);
            g.beginPath();
            g.arc(px, py, 2.2, 0, 6.283);
            g.fill();
          });
        } else {
          const cx = W / 2,
            cy = H / 2,
            breath = reduce ? 0.5 : (Math.sin(sT * 0.55) * 0.5 + 0.5),
            dotR = Math.max(2.5, unit * 0.02),
            breathR = unit * (0.20 + 0.12 * breath);
          g.lineCap = 'round';
          g.strokeStyle = col(0.9);
          g.lineWidth = 2.5;
          g.beginPath();
          g.arc(cx, cy, breathR, 0, 6.283);
          g.stroke();
          g.fillStyle = col(0.82);
          g.beginPath();
          g.arc(cx, cy, dotR, 0, 6.283);
          g.fill();
        }
      }

      function loop() {
        raf = requestAnimationFrame(loop);
        const d = devicePixelRatio || 1;
        if (Math.round(canvas.clientWidth * d) !== canvas.width || Math.round(canvas.clientHeight * d) !== canvas.height) fit();
        draw();
      }

      function start() {
        if (!raf) {
          fit();
          loop();
        }
      }

      function stop() {
        if (raf) {
          cancelAnimationFrame(raf);
          raf = null;
        }
      }
      addEventListener('resize', function() {
        fit();
        if (!reduce) {
          if (reeds.length) {
            const want = Math.round(Math.max(7, Math.min(22, _fieldW() / 100)));
            if (want !== reeds.length) _initReeds();
          }
          if (motes.length) {
            const want = Math.round(Math.max(9, Math.min(20, _fieldW() / 70)));
            if (want !== motes.length) _initMotes();
          }
          if (flies.length) {
            const want = Math.round(Math.max(7, Math.min(14, _fieldW() / 100)));
            if (want !== flies.length) _initFlies();
          }
        }
      });
      return {
        set: set,
        show: show,
        start: start,
        stop: stop,
        fit: fit
      };
    }
    let sceneMap = [],
      _sessionScene = 'circles';

    function buildSceneMap() {
      _sessionScene = MM_SCENES[Math.floor(Math.random() * MM_SCENES.length)];
      const mode = st.scene || '';
      sceneMap = pSlides.map(function(b) {
        if (b.style !== 'q') return null;
        return mode ? mode : _sessionScene;
      });
    }

    function sceneMeta(i) {
      const b = pSlides[i],
        sc = sceneMap[i];
      return {
        q: !!(b && b.style === 'q'),
        scene: sc || 'circles',
        dark: !!(sc && MM_DARK[sc])
      };
    }

    function paintSlide(frameEl, boxEl, engine, html, meta) {
      meta = meta || {};
      if (engine) {
        if (meta.q) {
          engine.set(meta.scene || 'circles');
          engine.show(true);
        } else {
          engine.show(false);
        }
      }
      if (frameEl) frameEl.classList.toggle('dark', !!(meta.q && meta.dark));
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        boxEl.innerHTML = html;
        startBreakClock(boxEl);
        return;
      }
      const OUT = 240,
        IN = 440;
      boxEl.style.transition = 'opacity ' + OUT + 'ms cubic-bezier(.4,0,.2,1),transform ' + OUT + 'ms cubic-bezier(.4,0,.2,1)';
      boxEl.style.opacity = '0';
      boxEl.style.transform = 'translateY(-6px)';
      setTimeout(function() {
        boxEl.innerHTML = html;
        startBreakClock(boxEl);
        boxEl.style.transition = 'none';
        boxEl.style.transform = 'translateY(9px)';
        requestAnimationFrame(function() {
          boxEl.style.transition = 'opacity ' + IN + 'ms cubic-bezier(.22,1,.36,1),transform ' + IN + 'ms cubic-bezier(.22,1,.36,1)';
          boxEl.style.opacity = '1';
          boxEl.style.transform = 'none';
        });
      }, OUT);
    }

    let pSlides = [],
      pIdx = 0,
      sw = null;

    function studentURL() {
      return location.href.split("#")[0].split("?")[0] + "?student=1";
    }

    function openStudentWindow() {
      // pop-up window. In Circle: Share screen → Window → "Capacity Builder — Slides".
      sw = window.open(studentURL(), "cb_student", "width=1280,height=800");
      if (!sw) {
        alert("Pop-up blocked — allow pop-ups for this file so the student window can open.");
        return false;
      }
      return true;
    }
    window.addEventListener("message", e => {
      const d = e.data || {};
      if (IS_STUDENT) {
        if (d.cbSlide !== undefined) {
          const f = document.getElementById("frame");
          if (f) {
            paintSlide(document.getElementById("cbframe"), f, window.__cbEngine, d.cbSlide, d.cbMeta || {});
          }
        }
        return;
      }
      if (d.cbReady) pRender();
      else if (d.cbNav === 1) pNext();
      else if (d.cbNav === -1) pPrev();
    });

    function bootStudent() {
      document.title = "Capacity Builder — Slides";
      const css = document.createElement("style");
      css.textContent = STUDENT_PAGE_CSS + STUDENT_CSS;
      document.head.appendChild(css);
      document.body.innerHTML = '<div class="cbframe" id="cbframe"><canvas class="cbscene" id="cbscene"></canvas><div class="cbslidebox" id="frame"></div></div>';
      window.__cbEngine = makeSceneEngine(document.getElementById("cbscene"));
      window.__cbEngine.start();
      document.addEventListener("keydown", e => {
        if (!window.opener) return;
        if (e.key === "ArrowRight" || e.key === " ") window.opener.postMessage({
          cbNav: 1
        }, "*");
        else if (e.key === "ArrowLeft") window.opener.postMessage({
          cbNav: -1
        }, "*");
      });
      if (window.opener) window.opener.postMessage({
        cbReady: 1
      }, "*");
    }

    function fmtNote(n) {
      if (!n) return "";
      let html = "";
      n.split(/<br>| — /).forEach(part => {
        part = part.trim();
        if (!part) return;
        const qs = part.match(/[^?]+\?/g);
        const onlyQs = qs && qs.join("").replace(/\s/g, "") === part.replace(/\s/g, "");
        if (qs && qs.length > 1 && onlyQs && qs.every(q => q.trim().length < 48)) {
          html += '<ul>' + qs.map(q => '<li>' + q.trim() + '</li>').join("") + '</ul>';
        } else {
          html += '<p>' + part + '</p>';
        }
      });
      return html;
    }
    let _breakInt = null;

    function startBreakClock(root) {
      if (_breakInt) {
        clearInterval(_breakInt);
        _breakInt = null;
      }
      if (!root) return;
      const el = root.querySelector(".breakclock .bt");
      if (!el) return;
      const total = parseInt(el.getAttribute("data-secs"), 10) || 0;
      const end = Date.now() + total * 1000;
      const upd = () => {
        let rem = Math.round((end - Date.now()) / 1000);
        if (rem < 0) rem = 0;
        el.textContent = Math.floor(rem / 60) + ":" + String(rem % 60).padStart(2, "0");
        if (rem <= 0) {
          clearInterval(_breakInt);
          _breakInt = null;
        }
      };
      upd();
      _breakInt = setInterval(upd, 250);
    }

    function pRender() {
      if (!pSlides.length) return;
      const b = pSlides[pIdx];
      if (sw && !sw.closed) {
        sw.postMessage({
          cbSlide: studentSlideHTML(b),
          cbMeta: sceneMeta(pIdx)
        }, "*");
      }
      // presenter console — same fluid slide markup, sized by its own container
      if (document.getElementById("pvSlide")) paintSlide(document.getElementById("pvFrame"), document.getElementById("pvSlide"), window.__cbPreview, studentSlideHTML(b), sceneMeta(pIdx));

      document.getElementById("cNotes").innerHTML = fmtNote(b.note);
      const nxt = pSlides[pIdx + 1];
      document.getElementById("cNext").innerHTML = nxt ? ("Next: <b>" + (nxt.style === "ptitle" ? nxt.kind + ": " + nxt.h : nxt.h.replace(/<br>/g, " ")) + "</b>") : "Next: — end of session —";
      document.getElementById("pCount").textContent = (b.kind || "");
    }

    function startPresent() {
      if (!openStudentWindow()) return;
      if (t0 === null) t0 = Date.now();
      pSlides = buildBeats();
      buildSceneMap();
      pIdx = Math.max(0, pSlides.findIndex(b => b.section === curTab));
      document.getElementById("console").classList.add("on");
      {
        const pv = document.getElementById("pvBox");
        pv.innerHTML = '<div class="cbframe" id="pvFrame"><canvas class="cbscene" id="pvScene"></canvas><div class="cbslidebox" id="pvSlide"></div></div>';
        if (window.__cbPreview) window.__cbPreview.stop();
        window.__cbPreview = makeSceneEngine(document.getElementById("pvScene"));
        window.__cbPreview.start();
      }
      tick();
      pRender();
    }

    function endPresent() {
      document.getElementById("console").classList.remove("on");
      if (window.__cbPreview) {
        window.__cbPreview.stop();
        window.__cbPreview = null;
      }
      if (sw && !sw.closed) sw.close();
      sw = null;
    }

    function pNext(e) {
      if (e) e.stopPropagation();
      if (pIdx < pSlides.length - 1) {
        pIdx++;
        pRender();
      }
    }

    function pPrev(e) {
      if (e) e.stopPropagation();
      if (pIdx > 0) {
        pIdx--;
        pRender();
      }
    }
    document.addEventListener("keydown", e => {
      if (IS_STUDENT) return;
      const c = document.getElementById("console");
      if (!c || !c.classList.contains("on")) return;
      if (e.key === "ArrowRight" || e.key === " ") pNext();
      else if (e.key === "ArrowLeft") pPrev();
      else if (e.key === "Escape") endPresent();
    });

    /* ---------- PRESENT-MODE TIMER ---------- */
    let t0 = null;

    function tick() {}

    /* ---------- DRAGGABLE LEFT MENU ---------- */
    (function() {
      const sp = document.getElementById("splitter");
      if (!sp) return;
      const dials = document.querySelector(".dials");
      let dragging = false;
      sp.addEventListener("pointerdown", e => {
        dragging = true;
        sp.classList.add("dragging");
        sp.setPointerCapture(e.pointerId);
        document.body.style.userSelect = "none";
      });
      sp.addEventListener("pointermove", e => {
        if (!dragging) return;
        const w = Math.max(240, Math.min(620, e.clientX - dials.getBoundingClientRect().left));
        dials.style.flex = "0 0 " + w + "px";
        dials.style.width = w + "px";
      });
      const stop = () => {
        dragging = false;
        sp.classList.remove("dragging");
        document.body.style.userSelect = "";
      };
      sp.addEventListener("pointerup", stop);
      sp.addEventListener("pointercancel", stop);
    })();

    if (IS_STUDENT) {
      bootStudent();
    } else {
      const css = document.createElement("style");
      css.textContent = STUDENT_CSS; // for the console preview
      document.head.appendChild(css);
      render();
    }

  </script>
</body>
